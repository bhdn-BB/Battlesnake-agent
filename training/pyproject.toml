[project]
name = "battlesnake-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "torch==2.8.0", "gymnasium==1.1.1",
  "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "psutil==7.0.0",
  "pytest==8.3.5", "fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
